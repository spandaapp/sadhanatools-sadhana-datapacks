name: Auto-merge new-pack and stats-only PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Check if this PR is a new pack or a pure stats update
        id: check
        run: node .github/scripts/check-automerge-eligible.mjs
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}

      # Mints a short-lived installation token for the automerge GitHub App on every run,
      # instead of a long-lived PAT sitting in secrets. The App (not any personal account's
      # role) is the ruleset's sole bypass actor — see datapacks-repo/README.md for why a
      # role-based bypass doesn't work safely here.
      - name: Generate automerge app token
        if: steps.check.outputs.automerge == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Auto-merge
        if: steps.check.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # --admin: without this, gh doesn't invoke bypass rights at all, even though the
        # App token generated above IS authorized to bypass via the ruleset's bypass_actors
        # entry (Integration, mode "pull_request"). This flag is the client-side signal to
        # actually use that authorization — it's not exclusive to classic-branch-protection
        # admin overrides as we initially assumed; confirmed live, same hint appears
        # regardless of how bypass eligibility was granted.
        run: gh pr merge --merge --admin "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
