name: Auto-merge new-pack and stats-only PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Check if this PR is a new pack or a pure stats update
        id: check
        run: node .github/scripts/check-automerge-eligible.mjs
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}

      - name: Auto-merge
        if: steps.check.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        # --admin: the PR is opened by the community-token identity, so it can never
        # satisfy "required approvals" via review (GitHub blocks self-approval). This
        # bypasses the review requirement outright instead, which needs the
        # AUTOMERGE_TOKEN account to hold Admin on the repo and branch protection's
        # "Do not allow bypassing the above settings" to be unchecked for `main`.
        run: gh pr merge --merge --admin "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
