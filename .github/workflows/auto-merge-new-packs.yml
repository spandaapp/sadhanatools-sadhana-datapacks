name: Auto-merge new-pack PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Check if this PR only adds a new pack
        id: check
        run: node .github/scripts/check-new-pack-only.mjs
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}

      - name: Auto-merge
        if: steps.check.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: gh pr merge --merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
